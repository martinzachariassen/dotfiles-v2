# Minimal two-line prompt: directory + git context on line one, a bare arrow
# on line two so commands always start at column 0 regardless of path depth.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$character"""

add_newline = true

palette = "custom"

[palettes.custom]
blue   = "#8caaee"
green  = "#a6d189"
yellow = "#e5c890"
red    = "#e78284"
mauve  = "#ca9ee6"
subtle = "#626880"

[directory]
style              = "bold blue"
truncation_length  = 3
truncation_symbol  = "…/"
format             = "[$path]($style)[$read_only]($read_only_style) "
read_only          = " 󰌾"
read_only_style    = "red"

[git_branch]
symbol = " "
style  = "bold mauve"
format = "[on ](subtle)[$symbol$branch]($style) "

[git_status]
style         = "yellow"
format        = "([$all_status$ahead_behind]($style)) "
conflicted    = "="
ahead         = "⇡${count}"
behind        = "⇣${count}"
diverged      = "⇕⇡${ahead_count}⇣${behind_count}"
untracked     = "?${count}"
stashed       = "*${count}"
modified      = "!${count}"
staged        = "+${count}"
renamed       = "»${count}"
deleted       = "✘${count}"

# Pushes cmd_duration to the right edge of the terminal without a
# right_format block (which would print on its own timing pass).
[fill]
symbol = " "

[cmd_duration]
min_time = 2000
style    = "dimmed subtle"
format   = "took [$duration]($style) "

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vicmd_symbol   = "[❮](bold yellow)"

# Runtime/tool segments: only fire when the directory actually matches
# (starship's default detection), kept visually consistent with the rest.
[nodejs]
symbol = " "
style  = "green"

[python]
symbol = " "
style  = "green"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[rust]
symbol = " "
style  = "red"

[golang]
symbol = " "
style  = "blue"

[docker_context]
symbol = " "
style  = "blue"

[package]
disabled = true

[battery]
disabled = true

[gcloud]
disabled = true

[aws]
disabled = true

[kubernetes]
disabled = true

[time]
disabled = true
