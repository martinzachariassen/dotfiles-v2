# Latte, not Frappe/Mocha: the ghostty pane background is light, and Latte is
# the only Catppuccin flavor built for a light base -- the others assume a
# dark pane and read too pale against a light one.
#
# Structure follows github.com/martinzachariassen/dotfiles's starship.toml --
# plain inline segments ("on branch", "via lang") instead of Powerline blocks,
# which need a specific bg color on every edge to butt segments together.
"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_latte"

format = """
$username$hostname\
$directory\
$git_branch$git_state$git_status\
$c$rust$golang$nodejs$bun$php$java$kotlin$haskell$python\
$docker_context\
$conda\
$line_break\
$character"""

add_newline = true
command_timeout = 2000

# show_always = false: only appears for root or when $USER differs from the
# login user -- e.g. a sudo'd shell or a container -- so a normal local
# session shows nothing here.
[username]
show_always = false
style_user = "bold red"
style_root = "bold red"
format = "[$user]($style) "

# ssh_only: invisible on a local shell, shows up over SSH -- exactly when
# "which box am I on" matters.
[hostname]
ssh_only = true
style = "bold peach"
format = "[@$hostname]($style) "

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = " "
style = "lavender"
truncation_length = 32
format = "on [$symbol$branch]($style) "

# Only renders mid-rebase/merge/cherry-pick/bisect -- the one moment it
# matters (3/7 commits in) it's the difference between guessing and knowing.
[git_state]
style = "bold peach"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
style = "peach"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
modified = "!${count} "
untracked = "?${count} "
stashed = "≡ "
staged = "+${count} "
conflicted = "✗ "
format = "[$all_status$ahead_behind]($style)"

[c]
symbol = " "
style = "sapphire"
format = "via [$symbol($version )]($style)"

[rust]
symbol = " "
style = "red"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "sapphire"
format = "via [$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "green"
format = "via [$symbol($version )]($style)"

[bun]
symbol = " "
style = "yellow"
format = "via [$symbol($version )]($style)"

[php]
symbol = " "
style = "mauve"
format = "via [$symbol($version )]($style)"

[java]
symbol = " "
style = "red"
format = "via [$symbol($version )]($style)"

[kotlin]
symbol = " "
style = "mauve"
format = "via [$symbol($version )]($style)"

[haskell]
symbol = " "
style = "lavender"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "yellow"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[docker_context]
symbol = " "
style = "blue"
format = "via [$symbol$context]($style) "

[conda]
symbol = " "
style = "sapphire"
format = "via [$symbol$environment ]($style)"
ignore_base = false

# The format string ends with $line_break$character; disabling this collapses
# that onto one line and the prompt character stops sitting at column 0.
[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold lavender)"
vimcmd_replace_symbol = "[❮](bold lavender)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[palettes.catppuccin_latte]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"
